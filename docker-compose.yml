services:
  # ── Backend API ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # ── Frontend ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND: ""
        VITE_MAPBOX: ${VITE_MAPBOX}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
